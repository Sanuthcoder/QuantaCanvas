name: QuantaCanvas generation worker

# Three triggers, no manual clicking required:
#  1. repository_dispatch - fired by the website the moment a prompt is submitted.
#  2. schedule - a safety net so a job is never stranded if the dispatch fails.
#  3. workflow_dispatch - lets you run it by hand while debugging.
on:
  repository_dispatch:
    types: [quantacanvas-generate]
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

# Let a run finish; queue the next one instead of cancelling work in progress.
concurrency:
  group: quantacanvas-worker-${{ github.run_id }}
  
jobs:
  drain:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Drain the generation queue
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          GEMINI_API_KEYS: ${{ secrets.GEMINI_API_KEYS }}
          GEMINI_VISUALIZATION_MODELS: ${{ secrets.GEMINI_VISUALIZATION_MODELS }}
        run: python worker.py --drain
